name: E2E Proxy Test (端到端连通性测试)

on:
  workflow_dispatch:

jobs:
  build-and-test:
    name: 测试环境 - ${{ matrix.env_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env_name: "KVM/物理机 (内核特权模式)"
            docker_args: "--cap-add NET_ADMIN --cap-add SYS_MODULE --sysctl net.ipv4.conf.all.src_valid_mark=1"
          - env_name: "LXC/OVZ (用户态降级模式)"
            docker_args: "" 

    steps:
      - name: 📥 检出项目源码
        uses: actions/checkout@v4

      - name: 🔨 从源码构建 Docker 镜像 (Local Build)
        run: |
          echo "开始构建 microwarp-test 镜像..."
          docker build -t microwarp-test:local .

      - name: 🚀 部署并运行容器 (${{ matrix.env_name }})
        run: |
          docker run -d \
            --name test-container \
            ${{ matrix.docker_args }} \
            -e AUTO_RENEW_SECONDS=15 \
            -p 1080:1080 \
            microwarp-test:local
            
      - name: ⏳ 等待 WARP 隧道初次握手 (10秒)
        run: |
          echo "等待 10 秒钟让节点完成握手..."
          sleep 10

      - name: 🎯 测试 SOCKS5 短连接 (重载前)
        run: |
          echo "开始请求 SOCKS5 代理..."
          # 增加重试机制应对网络波动
          for i in {1..3}; do
            if curl -m 5 -s -x socks5h://127.0.0.1:1080 https://1.1.1.1/cdn-cgi/trace | grep -q "warp="; then
              echo -e "\n✅ 重载前代理连通性测试通过！"
              exit 0
            fi
            sleep 2
          done
          echo "❌ 初始代理连通性测试失败！"
          exit 1

      - name: "🏄 建立长连接测试 (KVM专属 - 限速下载跨越重载点)"
        if: contains(matrix.env_name, 'KVM')
        run: |
          echo "正在后台发起限速长连接下载任务..."
          curl -s -w "%{http_code}" --limit-rate 50k -x socks5h://127.0.0.1:1080 https://speed.cloudflare.com/__down?bytes=1000000 -o /dev/null > http_code.txt &
          echo $! > bg_pid.txt

      - name: ⏳ 等待触发热重载 (10秒)
        run: |
          echo "等待 10 秒钟，容器内的 15 秒定时重载任务此时将被触发..."
          sleep 10
          
      - name: 🎯 测试 SOCKS5 短连接 (重载后)
        run: |
          echo "开始请求 SOCKS5 代理 (重载后验证新账号)..."
          for i in {1..5}; do
            if curl -m 5 -s -x socks5h://127.0.0.1:1080 https://1.1.1.1/cdn-cgi/trace | grep -q "warp="; then
              echo -e "\n✅ 重载后新连接测试通过！账号已成功无缝切换。"
              exit 0
            fi
            echo "等待服务恢复重连..."
            sleep 1
          done
          echo "❌ 重载后服务未能恢复！"
          exit 1

      - name: "🏄 验证长连接存活状态 (KVM 零停机极限测试)"
        if: contains(matrix.env_name, 'KVM')
        run: |
          echo "等待后台长连接下载任务结束 (预期总耗时 20s)..."
          PID=$(cat bg_pid.txt)
          while kill -0 $PID 2>/dev/null; do
            sleep 1
          done
          
          if [ -s http_code.txt ]; then CODE=$(cat http_code.txt); else CODE="000"; fi
          
          if [ "$CODE" = "200" ]; then
            echo -e "\n✅ 太强了！在底层公私钥被完全替换的情况下，现有的 SOCKS5 长连接[0 毫秒] 掉线，完美存活！"
          else
            echo -e "\n❌ 长连接测试失败！发生断流，HTTP 状态码: $CODE"
            exit 1
          fi

      - name: "🔍 死亡快照 (仅在测试失败时执行)"
        if: failure()
        run: |
          echo "========================================="
          echo "    致命错误排查：容器内部网络状态快照    "
          echo "========================================="
          echo -e "\n---> IP 路由表:"
          docker exec test-container ip route || true
          echo -e "\n---> IP 地址分配:"
          docker exec test-container ip addr || true
          echo -e "\n---> WireGuard 握手状态 (如果为空说明被墙):"
          docker exec test-container wg show || true

      - name: 📜 打印容器启动完整日志
        if: always()
        run: |
          echo "========================================="
          echo "    MicroWARP 日志 - ${{ matrix.env_name }}    "
          echo "========================================="
          docker logs test-container
