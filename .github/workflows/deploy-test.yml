name: E2E Proxy Test (端到端连通性测试)

on:
  # 【默认开启】仅允许在 GitHub 网页上手动点击触发
  workflow_dispatch:
  
  # push:
  #   branches: [ main, next ]

jobs:
  build-and-test:
    name: 测试环境 - ${{ matrix.env_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 设为 false，即使一种模式测试失败，另一种模式也会继续跑完
      matrix:
        include:
          - env_name: "KVM/物理机 (内核特权模式)"
            # 赋予特权，程序将探测成功并使用 wg0 内核态
            docker_args: "--cap-add NET_ADMIN --cap-add SYS_MODULE --sysctl net.ipv4.conf.all.src_valid_mark=1"
          - env_name: "LXC/OVZ (用户态降级模式)"
            # 不给任何特权，模拟 LXC 环境，强制触发 wireproxy Fallback
            docker_args: "" 

    steps:
      - name: 📥 检出项目源码
        uses: actions/checkout@v4

      - name: 🔨 从源码构建 Docker 镜像 (Local Build)
        run: |
          echo "开始构建 microwarp-test 镜像..."
          docker build -t microwarp-test:local .

      - name: 🚀 部署并运行容器 (${{ matrix.env_name }})
        run: |
          docker run -d \
            --name test-container \
            ${{ matrix.docker_args }} \
            -p 1080:1080 \
            microwarp-test:local
            
      - name: ⏳ 等待 WARP 隧道初始化 (10秒)
        # wireproxy 的初始化甚至比内核态还要快一些，10秒足够了
        run: |
          echo "容器已启动，等待 10 秒钟让节点完成握手..."
          sleep 10

      - name: 🎯 测试 SOCKS5 代理连通性
        # 使用 curl 通过 1080 端口请求 Cloudflare 骨干网测速节点
        run: |
          echo "开始请求 SOCKS5 代理..."
          curl -v -m 10 -x socks5://127.0.0.1:1080 https://1.1.1.1/cdn-cgi/trace
          echo -e "\n✅ 代理连通性测试通过！"

      - name: 📜 打印容器启动完整日志
        # 无论成功还是失败，都打印出完整的日志供排查
        if: always()
        run: |
          echo "========================================="
          echo "    MicroWARP 日志 - ${{ matrix.env_name }}    "
          echo "========================================="
          docker logs test-container
